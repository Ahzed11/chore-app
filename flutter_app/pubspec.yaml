name: chore_app
description: "A household chores motivation app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Routing
  go_router: ^14.0.0
  # HTTP client
  dio: ^5.4.0
  # Secure token storage
  flutter_secure_storage: ^9.0.0
  # QR code generation (for invite screen)
  qr_flutter: ^4.1.0
  # Share sheet
  share_plus: ^10.0.0
  # Internationalisation / date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
