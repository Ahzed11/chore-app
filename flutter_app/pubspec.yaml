name: chore_app
description: "A household chores motivation app."
publish_to: 'none'

# version: MAJOR.MINOR.PATCH+CODE  where CODE = MAJOR*10000 + MINOR*100 + PATCH
# (CODE is the Android versionCode — must strictly increase per release for
# F-Droid to treat a new APK as an update; see TASK-095.)
version: 1.0.5+10005

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.0.0
  # HTTP client
  dio: ^5.4.0
  # Secure token storage
  flutter_secure_storage: ^9.0.0
  # QR code generation (invite link, shown in household management)
  qr_flutter: ^4.1.0
  # Share sheet
  share_plus: ^10.0.0
  # Internationalisation / date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
  assets:
    - assets/fonts/Outfit-OFL.txt
