[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.0",
    "bcrypt>=4.0.0",
    "PyJWT[crypto]>=2.8.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.49.0",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "structlog>=24.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-fail-under=75"

[tool.coverage.run]
# SQLAlchemy's async engine executes query compilation/execution inside a
# greenlet via greenlet_spawn(); without this, coverage.py's tracer is not
# reattached after crossing into that greenlet, so most statements in async
# DB-touching functions are (mis)reported as uncovered even when exercised.
concurrency = ["greenlet", "thread"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # SQLAlchemy relationship() string annotations reference models that are
    # resolved at runtime via the registry, not imported in the module.
    "F821",
]
