services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: choreapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-choreapp_dev}
      POSTGRES_DB: choreapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choreapp -d choreapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
    environment:
      DATABASE_URL: postgresql+asyncpg://choreapp:${POSTGRES_PASSWORD:-choreapp_dev}@db:5432/choreapp
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: 30
      APP_BASE_URL: http://localhost:8000
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
