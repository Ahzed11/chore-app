name: CI/CD

# Tests and lint run on every branch push so regressions are caught before
# merge (see TASK-069); the image publish job below stays default-branch only.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chore-app-api

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: choreapp
          POSTGRES_PASSWORD: choreapp_test
          POSTGRES_DB: choreapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint
        run: uv run ruff check .

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://choreapp:choreapp_test@localhost:5432/choreapp_test
          TEST_DATABASE_URL: postgresql+asyncpg://choreapp:choreapp_test@localhost:5432/choreapp_test
          JWT_SECRET: ci_jwt_secret_not_used_in_production
          JWT_ALGORITHM: HS256
          JWT_EXPIRY_DAYS: "7"
          APP_BASE_URL: http://localhost:8000
        run: >-
          uv run pytest tests/
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: warn

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    # Only push images from the default branch — not from PRs or feature branches.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # QEMU enables cross-building the arm64 variant on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Multi-arch manifest: x86 servers/NAS + ARM boards (Raspberry Pi,
          # ARM NAS models). Docker picks the right variant automatically.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GitHub Actions cache to speed up rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
