name: Flutter

# Analyze/test/build run on every branch push so regressions are caught
# before merge (see TASK-069).
#
# Release signing (TASK-063, hardened by TASK-099): the release APK MUST be
# signed with a stable, real keystore — the four secrets below. Android
# refuses to update an app whose signing key changed, so a debug-signed or
# key-rotated release is un-installable as an update for every existing user
# (the v1.0.0 incident: it shipped debug-signed and could never be updated).
# Since TASK-099:
#   * the debug-keystore fallback only applies to NON-release builds (forks,
#     branches without secrets) — a release is never published from it;
#   * the built APK's signer certificate is verified against the pinned
#     ANDROID_APK_CERT_SHA256 secret and the build FAILS on any drift;
#   * main pushes without a configured keystore fail the workflow loudly.
# The keystore must never change silently. Changing it deliberately requires
# an uninstall/reinstall migration for all users AND updating the pin.
#   ANDROID_KEYSTORE_BASE64   - base64-encoded .jks/.keystore file contents
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - alias of the signing key within the keystore
#   ANDROID_KEY_PASSWORD      - password for that key (often same as above)
#   ANDROID_APK_CERT_SHA256   - SHA-256 of the signing certificate (pin)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    # Needed to publish the release (TASK-093): the repo default is
    # read-only workflow permissions, so GITHUB_TOKEN must be granted
    # contents: write explicitly for the Create GitHub Release step.
    permissions:
      contents: write

    # The secrets context is not allowed in step-level `if:`; evaluate the
    # presence check here (where it is allowed) and gate the signing step
    # on the resulting env var instead.
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fully strict: infos, warnings, and errors all fail the build
      # (the deprecation-info backlog was cleared by TASK-067).
      - name: Analyse
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      # Decodes the release keystore secret (if configured) to a temp file
      # and exports the KEYSTORE_PATH/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD
      # env vars that android/app/build.gradle.kts reads for release signing.
      # Skipped entirely when the secret isn't set, so forks/PRs without
      # access to repo secrets still build (debug-signed fallback).
      - name: Configure release signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # --build-number ties the APK's versionCode to the version in
      # pubspec.yaml (MAJOR*10000 + MINOR*100 + PATCH, see TASK-095) so the
      # versionCode is deterministic, strictly increases per release, and
      # matches what F-Droid reads from the APK manifest.
      - name: Extract versionCode from pubspec
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_CODE=$(echo "$APP_VERSION" | cut -d+ -f2)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release --build-number=$VERSION_CODE

      # --- Signing-key drift guard (TASK-099) ------------------------------
      # Android refuses to install an update whose signing key changed, so a
      # release signed with any key other than the pinned one is a brick for
      # every existing user (the v1.0.0 incident shipped debug-signed). This
      # step fails the build on ANY drift. Runs whenever a keystore is
      # configured; without a keystore the release steps are fail-closed
      # below, so no unverifiable APK can ever be published.
      - name: Verify APK signing certificate
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::ANDROID_APK_CERT_SHA256 secret is not set."
            echo "The release APK signature would be unverifiable — refusing to build."
            echo "Set it to the SHA-256 of your release keystore's signing certificate:"
            echo "  keytool -list -v -keystore <keystore> -alias <alias> | grep 'SHA256:'"
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under Android build-tools"
            exit 1
          fi

          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ' ')

          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::could not extract a signer certificate SHA-256 from $APK"
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED" ]; then
            echo "::error::Release APK signing certificate mismatch!"
            echo "  expected (pinned): $EXPECTED"
            echo "  actual (this build): $ACTUAL_SHA256"
            echo "A different keystore signed this APK, so existing installs CANNOT"
            echo "update to it. Restore the original keystore secrets, or — only if"
            echo "an uninstall/reinstall migration is intended — update"
            echo "ANDROID_APK_CERT_SHA256 to match the new certificate."
            exit 1
          fi

          echo "APK signing certificate verified: $ACTUAL_SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chore-app-${{ github.sha }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # --- Release publishing (TASK-093, hardened by TASK-099) -------------
      # On push to main only, publish the signed APK as a GitHub Release so
      # the F-Droid repo (Ahzed11/chore-app-fdroid) can index it. Version
      # must be bumped in pubspec.yaml before merging: the tag is derived
      # from versionName and must not already exist. Fail closed: a release
      # without a configured keystore would be debug-signed and un-updatable.
      - name: Ensure release signing is configured (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_ANDROID_KEYSTORE != 'true'
        run: |
          echo "::error::Cannot publish a release: ANDROID_KEYSTORE_* secrets are not set."
          echo "A debug-signed release cannot be updated by any user (Android refuses"
          echo "signature changes) — see the v1.0.0 incident. Configure the keystore"
          echo "secrets (ANDROID_KEYSTORE_BASE64/PASSWORD, ANDROID_KEY_ALIAS/PASSWORD)"
          echo "and the ANDROID_APK_CERT_SHA256 pin, or remove the version bump."
          exit 1

      - name: Prepare release tag
        id: prepare_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          TAG="v$(echo "$APP_VERSION" | cut -d+ -f1)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          # Exact tag match (anchor the line): ls-remote prints
          # "<sha>\trefs/tags/<tag>" and may add "^{}" for annotated tags.
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -qE "refs/tags/$TAG(\^\{\})?$"; then
            echo "Tag $TAG already exists, skipping release creation"
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true' && env.HAS_ANDROID_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            ChoreApp ${{ env.TAG }}

            Automated release built from commit `${{ github.sha }}` on `main`.
            The F-Droid repository indexes this release automatically.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
