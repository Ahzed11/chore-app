name: Flutter

# Analyze/test/build run on every branch push so regressions are caught
# before merge (see TASK-069).
#
# Optional release signing (TASK-063): set these four repository secrets to
# have the release APK signed with a real keystore instead of the Flutter
# debug keystore (see android/app/build.gradle.kts for the fallback logic).
# The build stays green with the debug-signed fallback if any is unset.
#   ANDROID_KEYSTORE_BASE64   - base64-encoded .jks/.keystore file contents
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - alias of the signing key within the keystore
#   ANDROID_KEY_PASSWORD      - password for that key (often same as above)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    # Needed to publish the release (TASK-093): the repo default is
    # read-only workflow permissions, so GITHUB_TOKEN must be granted
    # contents: write explicitly for the Create GitHub Release step.
    permissions:
      contents: write

    # The secrets context is not allowed in step-level `if:`; evaluate the
    # presence check here (where it is allowed) and gate the signing step
    # on the resulting env var instead.
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fully strict: infos, warnings, and errors all fail the build
      # (the deprecation-info backlog was cleared by TASK-067).
      - name: Analyse
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      # Decodes the release keystore secret (if configured) to a temp file
      # and exports the KEYSTORE_PATH/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD
      # env vars that android/app/build.gradle.kts reads for release signing.
      # Skipped entirely when the secret isn't set, so forks/PRs without
      # access to repo secrets still build (debug-signed fallback).
      - name: Configure release signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # --build-number ties the APK's versionCode to the version in
      # pubspec.yaml (MAJOR*10000 + MINOR*100 + PATCH, see TASK-095) so the
      # versionCode is deterministic, strictly increases per release, and
      # matches what F-Droid reads from the APK manifest.
      - name: Extract versionCode from pubspec
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_CODE=$(echo "$APP_VERSION" | cut -d+ -f2)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release --build-number=$VERSION_CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chore-app-${{ github.sha }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # --- Release publishing (TASK-093) ----------------------------------
      # On push to main only, publish the signed APK as a GitHub Release so
      # the F-Droid repo (Ahzed11/chore-app-fdroid) can index it. Version
      # must be bumped in pubspec.yaml before merging: the tag is derived
      # from versionName and must not already exist.
      - name: Prepare release tag
        id: prepare_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          TAG="v$(echo "$APP_VERSION" | cut -d+ -f1)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          # Exact tag match (anchor the line): ls-remote prints
          # "<sha>\trefs/tags/<tag>" and may add "^{}" for annotated tags.
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -qE "refs/tags/$TAG(\^\{\})?$"; then
            echo "Tag $TAG already exists, skipping release creation"
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            ChoreApp ${{ env.TAG }}

            Automated release built from commit `${{ github.sha }}` on `main`.
            The F-Droid repository indexes this release automatically.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
